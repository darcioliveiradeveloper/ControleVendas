<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glow by Tamires</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23E75480'/><stop offset='1' stop-color='%239B72CF'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif' font-weight='bold'>G</text><path d='M78 14 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2 z' fill='white' opacity='0.9'/></svg>" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>
  <main class="auth-page">
    <section class="auth-card">
      <div class="auth-header">
        <div class="logo">
          <svg class="logo-svg" viewBox="0 0 100 100" aria-hidden="true">
            <text x="50" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="62" fill="#fff">G</text>
            <path d="M78 14 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2 z" fill="#fff" opacity="0.9" />
            <circle cx="20" cy="28" r="2.5" fill="#fff" opacity="0.7" />
          </svg>
        </div>
        <h1>Glow by Tamires</h1>
        <p class="subtitle">Beleza &amp; autocuidado</p>
      </div>

      <div class="field campo-servidor">
        <label for="config-servidor">Endereço do servidor</label>
        <input id="config-servidor" type="text" placeholder="http://localhost:3000" autocomplete="off" />
        <span class="help">Celular na mesma rede? Use o IP do computador, ex.: http://192.168.1.10:3000</span>
      </div>

      <div class="tabs">
        <button id="tab-login" class="tab active" type="button">Entrar</button>
        <button id="tab-cadastro" class="tab" type="button">Criar conta</button>
      </div>

      <form id="form-login" class="form" autocomplete="off">
        <div class="field">
          <label for="login-email">Email</label>
          <input id="login-email" name="email" type="email" placeholder="seu@email.com" required />
        </div>
        <div class="field">
          <label for="login-senha">Senha</label>
          <input id="login-senha" name="senha" type="password" placeholder="Sua senha" required />
        </div>
        <button type="submit" class="btn primary">Entrar</button>
      </form>

      <form id="form-cadastro" class="form hidden" autocomplete="off">
        <div class="field">
          <label for="cad-nome">Nome</label>
          <input id="cad-nome" name="nome" type="text" placeholder="Seu nome" required />
        </div>
        <div class="field">
          <label for="cad-email">Email</label>
          <input id="cad-email" name="email" type="email" placeholder="seu@email.com" required />
        </div>
        <div class="field">
          <label for="cad-senha">Senha</label>
          <input id="cad-senha" name="senha" type="password" placeholder="Crie uma senha" required minlength="4" />
        </div>
        <button type="submit" class="btn primary">Criar conta</button>
      </form>

      <div id="mensagem" class="mensagem hidden"></div>
    </section>
  </main>

  <script src="js/api.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
