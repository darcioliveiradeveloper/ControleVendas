<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Glow by Tamires</title>
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><defs><linearGradient id='g' x1='0' y1='0' x2='1' y2='1'><stop offset='0' stop-color='%23E75480'/><stop offset='1' stop-color='%239B72CF'/></linearGradient></defs><rect width='100' height='100' rx='22' fill='url(%23g)'/><text x='50' y='72' font-size='58' text-anchor='middle' fill='white' font-family='Georgia,serif' font-weight='bold'>G</text><path d='M78 14 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2 z' fill='white' opacity='0.9'/></svg>" />
  <link rel="stylesheet" href="css/app.css?v=16" />
</head>
<body>
  <div class="app">
    <aside id="sidebar" class="sidebar">
      <div class="sidebar-logo">
        <div class="logo">
          <svg class="logo-svg" viewBox="0 0 100 100" aria-hidden="true">
            <text x="50" y="73" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="bold" font-size="62" fill="#fff">G</text>
            <path d="M78 14 l3.2 8 8 3.2 -8 3.2 -3.2 8 -3.2 -8 -8 -3.2 8 -3.2 z" fill="#fff" opacity="0.9" />
            <circle cx="20" cy="28" r="2.5" fill="#fff" opacity="0.7" />
          </svg>
        </div>
        <h2>Glow by Tamires</h2>
      </div>

      <nav class="nav" id="nav">
        <button class="nav-item" data-tela="vendas">
          <span class="nav-icon">🛒</span> Vendas
        </button>
        <button class="nav-item" data-tela="clientes">
          <span class="nav-icon">👥</span> Clientes
        </button>
        <button class="nav-item" data-tela="produtos">
          <span class="nav-icon">📦</span> Produtos
        </button>
        <button class="nav-item" data-tela="estoque">
          <span class="nav-icon">🗃️</span> Estoque
        </button>
        <button class="nav-item" data-tela="despesas">
          <span class="nav-icon">💸</span> Despesas
        </button>
        <button class="nav-item" data-tela="relatorios">
          <span class="nav-icon">📈</span> Relatórios
        </button>
        <button class="nav-item" data-tela="resumo">
          <span class="nav-icon">📊</span> Resumo
        </button>
      </nav>

      <div class="sidebar-user">
        <span id="usuario-nome">Carregando...</span>
        <div class="sidebar-user-acoes">
          <button class="btn secondary small" id="btn-backup">💾 Backup</button>
          <button class="btn secondary small" id="btn-sair">Sair</button>
        </div>
      </div>
    </aside>

    <div id="overlay" class="overlay hidden"></div>

    <main class="main">
      <header class="topbar">
        <button id="btn-menu" class="icon-btn" type="button">☰</button>
        <h1 id="titulo-tela">Vendas</h1>
      </header>

      <div class="content">
        <section id="tela-resumo" class="tela"></section>
        <section id="tela-produtos" class="tela hidden"></section>
        <section id="tela-estoque" class="tela hidden"></section>
        <section id="tela-vendas" class="tela hidden"></section>
        <section id="tela-despesas" class="tela hidden"></section>
        <section id="tela-clientes" class="tela hidden"></section>
        <section id="tela-relatorios" class="tela hidden"></section>
      </div>
    </main>
  </div>

  <script src="js/api.js?v=16"></script>
  <script src="js/app-shell.js?v=16"></script>
  <script src="js/resumo.js?v=16"></script>
  <script src="js/produtos.js?v=16"></script>
  <script src="js/estoque.js?v=16"></script>
  <script src="js/vendas.js?v=16"></script>
  <script src="js/despesas.js?v=16"></script>
  <script src="js/clientes.js?v=16"></script>
  <script src="js/relatorios.js?v=16"></script>
</body>
</html>
